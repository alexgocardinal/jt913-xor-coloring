name: Lean and graph verification
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: true
          use-mathlib-cache: true
      - name: Audit final theorems
        working-directory: lean
        run: lake env lean Audit.lean
      - name: Test graph code
        run: python3 -m unittest discover -s graph_code -p 'test_*.py' -v
